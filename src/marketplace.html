<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>插件广场</title>
  <style>
    :root, html[data-theme="light"] {
      color-scheme: light;
      --page: #f7f7f8;
      --fg: #171717;
      --muted: #6b7280;
      --card: #ffffff;
      --line: #ececec;
      --input: #ffffff;
      --input-line: #e5e7eb;
      --btn: #171717;
      --btn-fg: #ffffff;
      --ghost: #ffffff;
      --tag: #f3f4f6;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --page: #141414;
      --fg: #f5f5f5;
      --muted: #a1a1aa;
      --card: #1c1c1c;
      --line: #2a2a2a;
      --input: #171717;
      --input-line: #3f3f46;
      --btn: #f5f5f5;
      --btn-fg: #171717;
      --ghost: #171717;
      --tag: #27272a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--page); color: var(--fg); font-family: "Segoe UI", system-ui, sans-serif; }
    header {
      padding: 16px 20px 12px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    h1 { font-size: 1.15rem; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 10px; }
    .row { display: flex; gap: 8px; }
    input, select {
      border: 1px solid var(--input-line);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      background: var(--input);
      color: var(--fg);
    }
    input { flex: 1; }
    main { padding: 12px 16px 24px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .card h2 { font-size: 1rem; margin: 0 0 4px; }
    .meta { color: var(--muted); font-size: 0.8rem; margin-bottom: 6px; }
    .desc { font-size: 0.9rem; line-height: 1.45; margin: 0 0 10px; }
    button {
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 6px 10px;
      font: inherit;
      cursor: pointer;
      background: var(--btn);
      color: var(--btn-fg);
      margin-right: 6px;
    }
    button.ghost { background: var(--ghost); color: var(--fg); border: 1px solid var(--input-line); }
    button:disabled { opacity: 0.45; cursor: default; }
    .tag { display: inline-block; background: var(--tag); border-radius: 999px; padding: 1px 8px; font-size: 0.75rem; margin-right: 4px; }
    .ok { color: #4ade80; }
    html[data-theme="light"] .ok { color: #15803d; }
    .err { color: #f87171; white-space: pre-wrap; }
    html[data-theme="light"] .err { color: #b91c1c; }
    #status { min-height: 1.3em; font-size: 0.85rem; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>插件广场</h1>
    <p class="sub">目录来自 Oh-DSH 使用的公开 dsh-suite catalog。安装走本机 <code>dsh plugin --profile web</code>，装完会自动重启 <code>dsh web</code> 才会生效。</p>
    <div class="row">
      <input id="q" placeholder="搜索名称、仓库或描述" />
      <select id="cat">
        <option value="">全部分类</option>
      </select>
    </div>
    <div id="status"></div>
  </header>
  <main id="list"></main>
  <script>
    if (window.dshApp && window.dshApp.theme && window.dshApp.theme.onSet) {
      window.dshApp.theme.onSet((theme) => {
        document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
      });
    }
    const api = window.dshApp && window.dshApp.marketplace;
    const listEl = document.getElementById('list');
    const qEl = document.getElementById('q');
    const catEl = document.getElementById('cat');
    const statusEl = document.getElementById('status');
    let snapshot = { plugins: [] };

    function setStatus(text, cls) {
      statusEl.className = cls || '';
      statusEl.textContent = text || '';
    }

    function render() {
      const q = qEl.value.trim().toLowerCase();
      const cat = catEl.value;
      const items = snapshot.plugins.filter((p) => {
        if (cat && p.category !== cat) return false;
        if (!q) return true;
        return [p.title, p.id, p.repository, p.description].join(' ').toLowerCase().includes(q);
      });
      listEl.innerHTML = items.map((p) => `
        <article class="card" data-id="${p.id}">
          <h2>${escapeHtml(p.title)} ${
            p.installed && p.mountable === false
              ? '<span class="tag">未挂载</span>'
              : p.installed ? '<span class="tag">已安装</span>' : ''
          }</h2>
          <div class="meta">${escapeHtml(p.category)} · ${escapeHtml(p.repository)} · ★${p.stars}</div>
          <p class="desc">${escapeHtml(p.description)}${
            p.installed && p.mountable === false
              ? ' <span class="err">已下载仓库源码，但不是可挂载的 dsh 插件。</span>'
              : ''
          }</p>
          <div>
            ${p.installed && p.mountable === false
              ? `<button data-act="repair" data-id="${escapeHtml(p.id)}">修复并启用</button>
                 <button data-act="uninstall" data-id="${escapeHtml(p.id)}">卸载</button>`
              : p.installed
                ? `<button data-act="uninstall" data-id="${escapeHtml(p.id)}">卸载</button>`
                : `<button data-act="install" data-id="${escapeHtml(p.id)}">安装到 web profile</button>`}
            <button class="ghost" data-act="open" data-url="${escapeHtml(p.url)}">打开仓库</button>
          </div>
        </article>
      `).join('') || '<p class="sub">没有匹配的插件。</p>';
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[ch]));
    }

    async function refresh() {
      if (!api) {
        setStatus('当前窗口无法访问插件中心接口。', 'err');
        return;
      }
      setStatus('正在加载公开目录…');
      snapshot = await api.snapshot();
      const cats = [...new Set(snapshot.plugins.map((p) => p.category))].sort();
      const current = catEl.value;
      catEl.innerHTML = '<option value="">全部分类</option>' + cats.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
      catEl.value = current;
      setStatus(`已加载 ${snapshot.plugins.length} 个插件` + (snapshot.generatedAt ? ` · 目录 ${snapshot.generatedAt}` : ''), 'ok');
      render();
    }

    listEl.addEventListener('click', async (event) => {
      const btn = event.target.closest('button');
      if (!btn || !api) return;
      const act = btn.dataset.act;
      if (act === 'open') {
        await api.openUrl(btn.dataset.url);
        return;
      }
      btn.disabled = true;
      setStatus(act === 'install'
        ? '正在安装（需要本机 pnpm + dsh，装完会重启 dsh web）…'
        : act === 'repair'
          ? '正在改装真正可挂载的插件包并重启 dsh web…'
          : '正在卸载并重启 dsh web…');
      try {
        const result = act === 'install'
          ? await api.install(btn.dataset.id)
          : act === 'repair'
            ? await api.repair(btn.dataset.id)
            : await api.uninstall(btn.dataset.id);
        if (result && result.ok) {
          setStatus(result.message || '完成', 'ok');
          await refresh();
        } else {
          setStatus((result && result.message) || '失败', 'err');
          btn.disabled = false;
        }
      } catch (err) {
        setStatus(String(err && err.message ? err.message : err), 'err');
        btn.disabled = false;
      }
    });
    qEl.addEventListener('input', render);
    catEl.addEventListener('change', render);
    refresh();
  </script>
</body>
</html>
