<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dsh app — 未找到 dsh</title>
  <style>
    :root { color-scheme: light; }
    html, body {
      margin: 0; height: 100%;
      background: #ffffff;
      color: #171717;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    main { min-height: 100%; display: grid; place-items: center; padding: 32px; }
    .card { max-width: 36rem; }
    .code {
      display: inline-block;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.75rem;
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 999px;
      padding: 2px 10px;
      margin-bottom: 12px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 10px; }
    p { color: #4b5563; line-height: 1.55; margin: 0 0 12px; }
    button {
      appearance: none;
      border: 0;
      background: #171717;
      color: #fff;
      font-size: 0.95rem;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #status { min-height: 1.4em; color: #111827; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="code" id="code">DSH_NOT_FOUND</div>
      <h1>还没有安装 dsh</h1>
      <p id="message">dsh app 只是外壳，需要本机的 dsh CLI。可以点下面按钮，由应用替你执行官方安装。</p>
      <p>
        <button type="button" id="install">一键安装 dsh</button>
      </p>
      <p id="status"></p>
      <p>装好后不必重装本应用。以后升级：<code>npm update -g @deepseek-ai/dsh</code></p>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const code = params.get('code') || 'DSH_NOT_FOUND';
    const message = params.get('message') || 'dsh was not found on PATH.';
    document.getElementById('code').textContent = code;
    document.getElementById('message').textContent = message;
    document.title = 'dsh app — ' + code;

    const btn = document.getElementById('install');
    const status = document.getElementById('status');
    const canInstall = window.dshApp && typeof window.dshApp.installDsh === 'function';
    if (!canInstall) {
      btn.disabled = true;
      status.textContent = '当前窗口无法调用安装。请手动执行 npm install -g @deepseek-ai/dsh';
    }
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      status.textContent = '正在安装 @deepseek-ai/dsh…';
      try {
        const result = await window.dshApp.installDsh();
        if (result && result.found) {
          status.textContent = '已安装：' + result.path;
          if (window.dshApp.retryBoot) await window.dshApp.retryBoot();
        } else {
          status.textContent = (result && result.code ? result.code + '：' : '') + (result && result.message ? result.message : '安装失败');
          btn.disabled = false;
        }
      } catch (err) {
        status.textContent = String(err && err.message ? err.message : err);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
